name: Dependabot auto-merge
on: pull_request_target
permissions:
  contents: write
  pull-requests: write
jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Mint merge App token
        id: apptoken
        if: >-
          (steps.metadata.outputs.package-ecosystem == 'github_actions' ||
           (steps.metadata.outputs.dependency-type == 'direct:development' &&
            steps.metadata.outputs.update-type != 'version-update:semver-major')) &&
          !contains(steps.metadata.outputs.dependency-names, 'actions/create-github-app-token') &&
          !contains(steps.metadata.outputs.dependency-names, 'dependabot/fetch-metadata')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          repositories: automerge-rehearsal
          permission-contents: write
          permission-pull-requests: write

      - name: Approve
        if: steps.apptoken.outcome == 'success'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge as the App
        if: steps.apptoken.outcome == 'success'
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
