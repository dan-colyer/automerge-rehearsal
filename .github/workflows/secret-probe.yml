name: secret-probe
on: [pull_request, pull_request_target]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event=${{ github.event_name }} actor=${{ github.actor }}"
          echo "client_id_present=${{ secrets.MERGE_APP_CLIENT_ID != '' }}"
          echo "private_key_present=${{ secrets.MERGE_APP_PRIVATE_KEY != '' }}"
