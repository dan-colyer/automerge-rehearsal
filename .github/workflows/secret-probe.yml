name: secret-probe
on:
  pull_request:
    types: [opened, synchronize, closed]
  pull_request_target:
  push:
    branches: [main]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event=${{ github.event_name }} action=${{ github.event.action }} actor=${{ github.actor }}"
          echo "client_id_present=${{ secrets.MERGE_APP_CLIENT_ID != '' }}"
          echo "private_key_present=${{ secrets.MERGE_APP_PRIVATE_KEY != '' }}"
